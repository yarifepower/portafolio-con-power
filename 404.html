<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Yarife Power</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    .lost { min-height: 100svh; display: grid; place-items: center; padding: 40px var(--gutter); text-align: center; background-color: var(--ivory); }
    .lost__img { width: min(200px, 46vw); margin: 0 auto 1.8rem; border: 6px solid #fff; border-radius: 18px; transform: rotate(-4deg); box-shadow: 0 20px 40px rgba(91, 11, 163, .18); }
    .lost .h2 { max-width: 14ch; margin: 0 auto; }
    .lost p { max-width: 40ch; margin: 1.2rem auto 2rem; color: #5d5a55; }
    .lost .hand { color: var(--orange); margin-bottom: .6rem; }
  </style>
</head>
<body>
  <main class="lost grid-bg" style="--grid: rgba(132,21,229,.07)">
    <div>
      <img class="lost__img" src="/assets/img/yarife/personaje-salto-400.webp" width="400" height="626" alt="Ilustración de Yarife saltando de alegría">
      <p class="hand">Error 404</p>
      <h1 class="h2">Esta página se fue a buscar su Power.</h1>
      <p>No la encontramos por aquí, pero tranqui: todos los proyectos te esperan en el inicio.</p>
      <a class="btn" href="/">Volver al inicio</a>
    </div>
  </main>
</body>
</html>
